services:
  mysql:
    image: mysql:8.4
    container_name: lyys-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lyys_store}
      MYSQL_USER: ${MYSQL_USER:-lyys_store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: